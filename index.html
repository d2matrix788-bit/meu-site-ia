<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>IA Texto em Voz</title>
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    textarea, button, select {
      width: 90%;
      max-width: 420px;
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #7b2cff;
      color: white;
    }
  </style>
</head>
<body>

  <h1>🎙️ IA Texto em Voz</h1>
  <p>Funciona no celular</p>

  <textarea id="texto" rows="4" placeholder="Digite seu texto..."></textarea>

  <select id="tipoVoz">
    <option value="masc">Voz masculina</option>
    <option value="fem">Voz feminina</option>
  </select>

  <button onclick="falar()">▶️ Falar</button>

  <script>
    function falar() {
      const texto = document.getElementById("texto").value;
      const tipo = document.getElementById("tipoVoz").value;

      if (!texto) {
        alert("Digite um texto");
        return;
      }

      const u = new SpeechSynthesisUtterance(texto);
      u.lang = "pt-BR";

      // Ajuste simples
      u.pitch = tipo === "fem" ? 1.3 : 0.8;
      u.rate = 1;

      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
  </script>

</body>
</html>
