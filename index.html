<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>IA Texto em Voz</title>
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    textarea, button {
      width: 90%;
      max-width: 400px;
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #7b2cff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🔊 IA Texto em Voz</h1>
  <p>Digite um texto e escute a voz</p>

  <textarea id="texto" rows="4" placeholder="Digite seu texto aqui..."></textarea>
  <button onclick="falar()">▶️ Falar</button>

  <script>
    function falar() {
      const texto = document.getElementById("texto").value;

      if (!texto) {
        alert("Digite um texto 🙂");
        return;
      }

      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = "pt-BR";
      voz.rate = 1;
      voz.pitch = 1;

      speechSynthesis.speak(voz);
    }
  </script>

</body>
</html>
